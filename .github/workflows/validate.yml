name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python scripts
        run: |
          python3 -m py_compile \
            scripts/package_claude_plugin.py \
            scripts/validate_claude_plugin_package.py \
            skills/legalize-kr/scripts/select_access_mode.py

      - name: Run repository tests
        run: python3 -m unittest discover -s tests

      - name: Validate Claude Cowork plugin ZIP
        run: |
          python3 scripts/package_claude_plugin.py
          python3 scripts/validate_claude_plugin_package.py dist/legalize-kr-plugin.zip
